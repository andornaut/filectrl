# One of: off, error, warn, info, debug, or trace
# Logs are written to stderr, only when it is redirected (e.g. `2>filectrl.log`)
# Applies from the end of config loading onward, so it cannot show the messages
# emitted while this file and its includes are being resolved; use $RUST_LOG for
# those, which overrides this setting
log_level = "off"

# Include files are merged on top of this config (later files take precedence)
# Relative paths are resolved from the directory containing this config file
# Run `filectrl --write-default-themes` to write theme.toml beside this file
# include_files = ["theme.toml"]

[file_system]
# Minimum time between filesystem updates to avoid excessive refreshes, at
# least 100. A directory that is slow to list waits at least four times as long
# as its last listing took.
refresh_debounce_milliseconds = 500
# Bounds on a recursive search: how many directory levels below the search root
# are visited, and how many matches are collected before the walk stops
search_max_depth = 20
search_max_results = 10000

# Programs to use to open files or directories, run with `sh -c`:
# %s stands for the relevant path, which the shell receives as an argument
# ("$@") rather than as part of the command, so a file name never runs as code.
# Only a template that hands it to another parser (eval, a nested sh -c, ssh,
# bash arithmetic such as $(( %s )), AppleScript's `do script`) can still run it. Write %s unquoted, as its
# own word: inside quotes it is split into words or left as literal text.
[openers.linux]
# xterm has no working directory option, so the shell changes into the directory
# and xterm inherits it
open_directory = "cd %s && exec xterm" # e.g. "alacritty --working-directory %s"
open_file = "xdg-open %s"
open_filectrl_window = "xterm -e filectrl %s" # e.g. "alacritty --command filectrl %s"
# Used by "open with" for desktop entries that declare Terminal=true. Here %s
# stands for the command to run, each word its own argument, rather than for a
# path. Set it to "" to leave such applications out of the picker.
run_in_terminal = "xterm -e %s" # e.g. "alacritty --command %s"

[openers.macos]
open_directory = "open -a Terminal %s"
open_file = "open %s"
# Terminal has no way to run a program with the path as its own argument: the
# only scriptable route types a command line into your login shell, which would
# parse the name. So this opens a Terminal window in the directory instead; run
# filectrl there.
open_filectrl_window = "open -a Terminal %s"
# Linux only: macOS resolves applications through Launch Services
run_in_terminal = ""

[ui]
# How long to wait to interpret multiple clicks to the same element as a double click
double_click_interval_milliseconds = 300
# Whether dotfiles are shown initially; toggle at runtime with the
# `toggle_show_hidden` keybinding
show_hidden_files = true
sort_directories_first = true
# Whether the Name column reads runs of digits as numbers, so file2 sorts
# before file10. When false, names compare character by character.
natural_sort = true

# Keybindings for normal mode and prompt mode.
# Arrow keys, Home/End, PageUp/PageDown, and Esc are always hardcoded.
# Values can be a single key string or an array of key strings.
# Key strings: single chars ("q"), uppercase implies Shift ("G"), named keys
# ("Enter", "Esc", "Backspace", "Delete", "Space", "Tab", "PgUp", "PgDn", "F2"),
# the aliases "Return", "Escape", "Del", "PageUp" and "PageDown", and modifier
# prefixes ("Ctrl+c", "Alt+x", "Ctrl+Shift+a").
[keybindings]
# Normal mode
add_bookmark = "B"
back = ["h", "b", "Backspace"]
cancel_task = "K"
chmod = "P"
clear_alerts = "Ctrl+l"
clear_progress = "Ctrl+p"
copy = ["y", "Ctrl+c"]
create_directory = "c"
cut = ["x", "Ctrl+x"]
delete = ["d", "Delete"]
edit = "e"
filter = ["f", "\\"]
go_home = "~"
go_to_previous_directory = "-"
goto = [":", "Tab"]
open = ["l", "Enter"]
open_current_directory = "t"
open_new_window = "w"
open_with = "o"
page = "i"
page_down = ["Ctrl+d", "Ctrl+f"]
page_up = ["Ctrl+u", "Ctrl+b"]
paste = ["p", "Ctrl+v"]
quit = "q"
range_mark = "V"
refresh = ["Ctrl+r", "F5"]
rename = ["r", "F2"]
search = "/"
select_all = "Ctrl+a"
show_bookmarks = ["'", "`"]
select_first = ["g", "^"]
select_last = ["G", "$"]
select_middle = "z"
select_first_visible = "H"
select_middle_visible = "M"
select_last_visible = "L"
select_next = "j"
select_previous = "k"
sort_by_modified = "m"
sort_by_name = "n"
sort_by_size = "s"
toggle_help = "?"
toggle_mark = ["v", "Space"]
toggle_show_hidden = "."

# Prompt mode
prompt_copy = "Ctrl+c"
prompt_cut = "Ctrl+x"
prompt_paste = "Ctrl+v"
prompt_reset = ["Ctrl+u", "Ctrl+z"]
prompt_select_all = "Ctrl+a"
prompt_submit = "Enter"
