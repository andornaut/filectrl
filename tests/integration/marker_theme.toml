# Marks the selected and marked table rows with unique backgrounds so tests can
# locate them in `tmux capture-pane -e` output as the SGR fragments
# "48;2;1;2;3"/"48;2;4;5;6" (truecolor) and "48;5;17"/"48;5;53" (--colors-256).
# The 256-color indices are ones the default theme does not otherwise use.
#
# The alert kinds get the same treatment, as foregrounds ("38;2;..."/"38;5;..."),
# because that is the only part of an alert line that says which kind it is.
# Info is absent: nothing outside the debug build raises one.
[theme.table.selected]
bg = "#010203"
fg = "#FEFDFC"

[theme.table.marked]
bg = "#040506"
fg = "#FBFAF9"

[theme256.table.selected]
bg = "17"
fg = "231"

[theme256.table.marked]
bg = "53"
fg = "255"

[theme.alert.warn]
fg = "#0A0B0C"

[theme.alert.error]
fg = "#0D0E0F"

[theme256.alert.warn]
fg = "55"

[theme256.alert.error]
fg = "56"
