# Hermetic config for integration tests. Partial: merges over built-in defaults.
log_level = "off"

[ui]
# Test-driven double clicks arrive as fast back-to-back events; the interval
# only needs to be large enough that two consecutive send-keys count.
double_click_interval_milliseconds = 400
show_hidden_files = true
sort_directories_first = true

[openers.linux]
# Never launch real programs from tests. `true` ignores its arguments.
open_directory = "true %s"
open_file = "true %s"
open_filectrl_window = "true %s"
run_in_terminal = ""
