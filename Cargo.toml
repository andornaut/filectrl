# https://doc.rust-lang.org/cargo/reference/manifest.html
[package]
authors = ["andornaut"]
description = """
FileCTRL is a light, opinionated, responsive, theme-able, and simple Text User Interface (TUI) file manager for Linux and macOS
"""
edition = "2024"
rust-version = "1.93"
license = "MIT"
name = "filectrl"
readme = "README.md"
repository = "https://github.com/andornaut/filectrl"
version = "0.5.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[dependencies]
anyhow = "1.0.104"
arboard = {version = "3", default-features = false, features = ["wayland-data-control"]}
argh = "0.1.19"
chrono = {version = "0.4.45", default-features = false, features = ["clock"]}
env_logger = {version = "0.11.11", default-features = false}
directories = "6.0.0"
log = {version = "0.4.33", default-features = false, features = ["serde"]}
nix = {version = "0.31.3", default-features = false, features = ["fs", "signal", "user"]}
notify = "8.2.0"
ratatui-textarea = {version = "0.9.2", features = ["crossterm"]}
ratatui = {version = "0.30.2", features = ["serde"]}
rustix = {version = "1.1", features = ["fs"]}
serde = {version = "1.0.229", features = ["derive"]}
toml = "1.1.3"
unicode-segmentation = "1.13.3"
unix_mode = "0.1.4"
shell-words = "1.1.1"

# "Open with" application discovery. Both use default-features = false:
# freedesktop-desktop-entry's default "gettext" feature pulls in gettext-sys,
# a C build dependency.
[target.'cfg(target_os = "linux")'.dependencies]
freedesktop-desktop-entry = {version = "0.8.1", default-features = false}
mime = "0.3.17" # xdg-mime's MIME type, which it does not re-export
xdg-mime = "0.4.0"

# NSWorkspace application lookup. default-features = false keeps this to five
# crates; the defaults pull in most of the AppKit/CoreGraphics surface.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = {version = "0.3.2", default-features = false, features = ["std", "NSWorkspace"]}
objc2-foundation = {version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSFileManager", "NSProcessInfo", "NSString", "NSURL"]}

[dev-dependencies]
cargo-husky = {version = "1.5.0", default-features = false, features = ["user-hooks"]}
test-case = "3.3.1"

[profile.release]
codegen-units = 1 # Reduce number of codegen units to increase optimizations.
lto = true # Enable Link Time Optimization
opt-level = 3 # Optimize for performance
panic = 'abort' # Abort on panic
strip = true # Symbols from Binary
