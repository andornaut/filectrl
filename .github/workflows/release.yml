name: Release

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
    # Release versions only, the same set protect-release-tags guards.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Write access is granted only to the jobs that create releases
permissions:
  contents: read

# Keyed on the branch rather than the ref, so a re-push to one branch cancels
# its own earlier run and not another branch's. Keyed by the event as well: a
# cancelled run leaves its check runs on the head commit, and GitHub counts
# those against the required checks, so a push and its pull request cancelling
# each other would block the merge.
# Qualified by the repository the branch lives in, since a fork names its
# branches itself: two pull requests from different forks would otherwise share
# a group whenever they pick the same branch name.
# A push to main is never cancelled: its dev-release moves the `dev` tag and
# then uploads, and a cancel between the two would leave the tag on a commit
# whose assets were never published. A newer push to main waits instead, and
# GitHub keeps only the latest waiting run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  # Publishing waits on the scan as well: a release is a durable artifact, and
  # taking an attribution back off after one is cut means rewriting history that
  # has already been published. Called only where a release can follow, since
  # the scan workflow already runs on every push and pull request of its own
  # accord.
  attributions:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/ai-attributions.yml

  # Publishing waits on the same checks that guard main. Called only where a
  # release can follow, since the Test workflow already runs on every push and
  # pull request of its own accord, and the jobs below are gated the same way.
  test:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/test.yml

  # Validates that every published target still compiles, and produces the
  # archive both releases ship. Runs on tags too, so that a release is only
  # created once all three targets are known to compile.
  build-platform:
    runs-on: ${{ matrix.os }}
    # Capped well under the six-hour default: nothing here runs longer than
    # six minutes, so a job still going at fifteen has hung rather than failed.
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          # Both Linux legs build with cross, in a container whose glibc (2.23,
          # Ubuntu 16.04 in cross 0.2.5) is older than the runner's, so the
          # binaries run on older distributions: a binary needs the glibc it
          # was linked against or newer. The container also supplies the
          # aarch64 sysroot; the crate graph needs no other native libraries.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: filectrl_linux_x86_64
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: filectrl_linux_arm64
            cross: true
          # macOS is Apple Silicon only.
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: filectrl_darwin_arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job uses the token, so it is not left
          # in .git/config for a later step to read.
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2.87.14
        with:
          # Pinned: the container image, and so the glibc the binaries need,
          # comes with the cross version.
          tool: cross@0.2.5

      - name: Add Rust target
        if: ${{ !matrix.cross }}
        run: rustup target add ${{ matrix.target }}

      # Keyed by target, since the legs share a runner OS and would otherwise
      # restore each other's build directory.
      - name: Cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}

      # --locked fails the build on a Cargo.lock that is out of date rather than
      # rewriting it, so the release is built from the committed dependency set.
      - name: Build
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --locked --release --target ${{ matrix.target }}

      # The archive both releases ship. The layout is what the README's install
      # one-liner expects: `filectrl` at the archive root, and a checksum in
      # `sha256sum -c` format beside it.
      - name: Archive for release
        run: |
          stage="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/filectrl" LICENSE README.md "$stage/"
          tar -czf "${{ matrix.archive }}.tar.gz" -C "$stage" filectrl LICENSE README.md
          # macOS runners carry shasum rather than sha256sum.
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.archive }}.tar.gz" > "${{ matrix.archive }}.sha256"
          else
            shasum -a 256 "${{ matrix.archive }}.tar.gz" > "${{ matrix.archive }}.sha256"
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}.tar.gz
            ${{ matrix.archive }}.sha256

  # A matrix leg reports as `build-platform (ubuntu-latest, x86_64-unknown-linux-gnu,
  # filectrl_linux_x86_64)`, a name that changes whenever the matrix does, and a required
  # check that stops reporting blocks every pull request forever. This job reports
  # under one stable name, so branch protection has a single check to require no
  # matter how the matrix grows.
  #
  # `always()` and not `!cancelled()`, which looks tidier and is a hole: a
  # cancelled run would skip this job, and GitHub counts a skipped required
  # check as passing, so an unverified commit becomes mergeable. Failing closed
  # costs a red check on runs that were cancelled anyway.
  build:
    name: Build
    needs: build-platform
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check that every platform built
        run: '[ "${{ needs.build-platform.result }}" = success ]'

  # Rolling build of main. Ships every platform the matrix builds, in the same
  # archives and under the same names a versioned release uses.
  dev-release:
    needs: [build, test, attributions]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # The same archives a versioned release ships, so what installs a tagged
      # release installs a dev one by changing the URL and nothing else. Merged:
      # every archive already carries its platform in its name, so nothing
      # collides, and each arrives with the `.sha256` the build wrote beside it,
      # which is what a download straddling a re-cut is checked against.
      - name: Download release archives
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          pattern: filectrl_*
          merge-multiple: true

      # A release follows its tag, and updating one below does not move the tag
      # GitHub already has, so `dev` has to be repointed here or the release's
      # commit link and source archives would describe an older build than the
      # assets beside them. Unmasked on purpose: a rejected tag push (tag
      # protection, or credentials the checkout did not persist) has to fail
      # the job rather than quietly publish binaries with the wrong commit.
      - name: Move the dev tag to this commit
        run: |
          git tag --force dev
          git push --force origin refs/tags/dev

      # Updated in place rather than deleted and recreated. Deleting first left
      # `dev` a 404 for the length of the upload, and permanently if the run
      # died in between; every asset name here is deterministic, so each upload
      # replaces its predecessor and nothing from the previous cut survives.
      - name: Publish dev release
        uses: softprops/action-gh-release@v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: dev
          name: dev
          body: Latest build from main branch
          make_latest: "false"
          files: artifacts/*

  # Versioned releases. Ships the archives build-platform already produced,
  # so each target is compiled once per tag rather than once for the gate and
  # again for the assets.
  release:
    needs: [build, test, attributions]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      # Checked out only to read the crate version. The assets come from
      # build-platform, and the notes below are generated from the tag by
      # GitHub rather than read out of the tree.
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # A tag that disagrees with Cargo.toml would publish a binary whose
      # --version names another release. Read from the manifest directly, so
      # the step needs no Rust toolchain on the runner. The package's version
      # is the only line that starts with `version =`: dependency versions sit
      # inside inline tables and `rust-version` has its own prefix.
      - name: Check that the tag matches the crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          [ "$TAG" = "v$version" ] || {
            echo "Tag $TAG does not match Cargo.toml version $version"
            exit 1
          }

      # Merged: every artifact holds differently named files, so nothing
      # collides, and the release wants them all in one directory.
      - name: Download release archives
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          pattern: filectrl_*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: "true"
          files: artifacts/*
