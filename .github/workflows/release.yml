name: Release

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than the ref, so the push event and the pull
# request event for one branch share a group instead of running the same checks
# twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install XCB dependencies
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@v2.1.1

  # Drives the real binary's TUI in tmux (tests/integration). The suites run
  # from the checkout, which `run_tests.sh --committed` reproduces locally.
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install XCB dependencies and tmux
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev tmux

      - name: Build release binary
        run: cargo build --release

      - name: Run integration tests
        run: tests/integration/run_tests.sh

  # Validates that every published target still compiles, and produces the
  # binary the dev release ships. Skipped on tags, where `release` builds the
  # same targets.
  build:
    needs: [check, integration]
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: filectrl-linux
          # cross builds in a container that supplies the aarch64 glibc
          # sysroot; the crate graph needs no other native libraries.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: filectrl-linux-arm64
            cross: true
          # macOS is Apple Silicon only.
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: filectrl-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install XCB dependencies
        if: matrix.os == 'ubuntu-latest' && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2.85.8
        with:
          tool: cross

      - name: Add Rust target
        if: ${{ !matrix.cross }}
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --target ${{ matrix.target }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/filectrl

  # Rolling build of main. Ships the bare Linux binary, matching the sibling
  # tools; the tarballs are reserved for versioned releases.
  dev-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: filectrl-linux
          path: artifacts

      # A release follows its tag, and updating one below does not move the tag
      # GitHub already has, so `dev` has to be repointed here or the release's
      # commit link and source archives would describe an older build than the
      # assets beside them. Unmasked on purpose: a rejected tag push (tag
      # protection, or credentials the checkout did not persist) has to fail
      # the job rather than quietly publish binaries with the wrong commit.
      - name: Move the dev tag to this commit
        run: |
          git tag --force dev
          git push --force origin refs/tags/dev

      # Updated in place rather than deleted and recreated. Deleting first left
      # `dev` a 404 for the length of the upload, and permanently if the run
      # died in between; every asset name here is deterministic, so each upload
      # replaces its predecessor and nothing from the previous cut survives.
      - name: Publish dev release
        uses: softprops/action-gh-release@v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: dev
          name: dev
          body: Latest build from main branch
          make_latest: "false"
          files: artifacts/filectrl

  # upload-rust-binary-action uploads to an existing release rather than
  # creating one, so the release has to exist before the matrix fans out.
  create-release:
    needs: [check, integration]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Create release
        # Tolerate an existing release so the workflow can be re-run.
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Versioned releases. The action builds, archives as
  # {name}_{system}_{arch}.tar.gz, emits a sha256 per archive, and uploads.
  # It selects and installs cross itself for non-host targets.
  release:
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      # Surface every failing target instead of stopping at the first, so a
      # broken leg cannot leave the release silently missing an asset.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: filectrl_linux_x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: filectrl_linux_arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: filectrl_darwin_arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install XCB dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build and upload release assets
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: filectrl
          target: ${{ matrix.target }}
          archive: ${{ matrix.archive }}
          include: LICENSE,README.md
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
