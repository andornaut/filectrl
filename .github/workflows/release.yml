name: Release

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
    # Release versions only, the same set protect-release-tags guards.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than the ref, so the push event and the pull
# request event for one branch share a group instead of running the same checks
# twice. Qualified by the repository the branch lives in, since a fork names its
# branches itself: a pull request from a fork's main would otherwise share a
# group with a push to this one and cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Publishing waits on the scan as well: a release is a durable artifact, and
  # taking an attribution back off after one is cut means rewriting history that
  # has already been published. Called only where a release can follow, since
  # the scan workflow already runs on every push and pull request of its own
  # accord.
  attributions:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/ai-attributions.yml

  # Publishing waits on the same checks that guard main. Called only where a
  # release can follow, since the Test workflow already runs on every push and
  # pull request of its own accord, and the jobs below are gated the same way.
  test:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/test.yml

  # Validates that every published target still compiles, and produces the
  # binary the dev release ships. Runs on tags too, so that a release is only
  # created once all three targets are known to compile.
  build-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: filectrl-linux
            archive: filectrl_linux_x86_64
          # cross builds in a container that supplies the aarch64 glibc
          # sysroot; the crate graph needs no other native libraries.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: filectrl-linux-arm64
            archive: filectrl_linux_arm64
            cross: true
          # macOS is Apple Silicon only.
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: filectrl-macos-arm64
            archive: filectrl_darwin_arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install XCB dependencies
        if: matrix.os == 'ubuntu-latest' && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2.85.8
        with:
          tool: cross

      - name: Add Rust target
        if: ${{ !matrix.cross }}
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --target ${{ matrix.target }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/filectrl

      # The archive a versioned release ships, built from the same binary the
      # dev release ships rather than from a second compile of the same target.
      # The layout is what the README's install one-liner expects: `filectrl` at
      # the archive root, and a checksum in `sha256sum -c` format beside it.
      - name: Archive for release
        run: |
          stage="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/filectrl" LICENSE README.md "$stage/"
          tar -czf "${{ matrix.archive }}.tar.gz" -C "$stage" filectrl LICENSE README.md
          # macOS runners carry shasum rather than sha256sum.
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.archive }}.tar.gz" > "${{ matrix.archive }}.sha256"
          else
            shasum -a 256 "${{ matrix.archive }}.tar.gz" > "${{ matrix.archive }}.sha256"
          fi

      # Named without a hyphen after `filectrl`, so the dev release's
      # `filectrl-*` download pattern collects only the bare binaries.
      - name: Upload release archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}.tar.gz
            ${{ matrix.archive }}.sha256

  # A matrix leg reports as `build-platform (ubuntu-latest, x86_64-unknown-linux-gnu,
  # filectrl-linux)`, a name that changes whenever the matrix does, and a required
  # check that stops reporting blocks every pull request forever. This job reports
  # under one stable name, so branch protection has a single check to require no
  # matter how the matrix grows.
  #
  # `always()` and not `!cancelled()`, which looks tidier and is a hole: a
  # cancelled run would skip this job, and GitHub counts a skipped required
  # check as passing, so an unverified commit becomes mergeable. Failing closed
  # costs a red check on runs that were cancelled anyway.
  build:
    name: Build
    needs: build-platform
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check that every platform built
        run: '[ "${{ needs.build-platform.result }}" = success ]'

  # Rolling build of main. Ships every platform the matrix builds; the tarballs
  # are reserved for versioned releases.
  dev-release:
    needs: [build, test, attributions]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Downloaded unmerged: every artifact holds a file called `filectrl`, so
      # merging them would have each platform overwrite the one before it.
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          pattern: filectrl-*

      # An asset whose name does not carry its platform is one a consumer has to
      # be told about out of band, so each binary takes the name of the
      # directory its artifact arrived in.
      - name: Name each binary for its platform
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            mv "$name/filectrl" "$name.bin"
            rmdir "$name"
            mv "$name.bin" "$name"
          done

      # `dev` is a moving tag, so a download that straddles a re-cut would
      # otherwise install a mixed set silently.
      - name: Write checksums
        run: cd artifacts && sha256sum filectrl-* > checksums.txt

      # A release follows its tag, and updating one below does not move the tag
      # GitHub already has, so `dev` has to be repointed here or the release's
      # commit link and source archives would describe an older build than the
      # assets beside them. Unmasked on purpose: a rejected tag push (tag
      # protection, or credentials the checkout did not persist) has to fail
      # the job rather than quietly publish binaries with the wrong commit.
      - name: Move the dev tag to this commit
        run: |
          git tag --force dev
          git push --force origin refs/tags/dev

      # Updated in place rather than deleted and recreated. Deleting first left
      # `dev` a 404 for the length of the upload, and permanently if the run
      # died in between; every asset name here is deterministic, so each upload
      # replaces its predecessor and nothing from the previous cut survives.
      - name: Publish dev release
        uses: softprops/action-gh-release@v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: dev
          name: dev
          body: Latest build from main branch
          make_latest: "false"
          files: artifacts/*

  # Versioned releases. Ships the archives build-platform already produced,
  # so each target is compiled once per tag rather than once for the gate and
  # again for the assets.
  release:
    needs: [build, test, attributions]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      # Merged: every artifact holds differently named files, so nothing
      # collides, and the release wants them all in one directory.
      - name: Download release archives
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          pattern: filectrl_*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: "true"
          files: artifacts/*
