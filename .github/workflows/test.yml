name: Test

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Called by the release workflow, so that nothing is published that this has
  # not passed. Workflows do not wait on each other, so a green Test run beside
  # a release says nothing about whether the release waited for it.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than the ref, so a re-push to one branch cancels
# its own earlier run and not another branch's. Keyed by the event as well: a
# cancelled run leaves its check runs on the head commit, and GitHub counts
# those against the required checks, so a push and its pull request cancelling
# each other would block the merge.
# Keyed by the calling workflow as well, so the run started by a push and the
# run the release workflow calls do not cancel each other.
# Qualified by the repository the branch lives in, since a fork names its
# branches itself: two pull requests from different forks would otherwise share
# a group whenever they pick the same branch name.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # macOS as well as Linux, because the release builds an aarch64-apple-darwin
  # binary and the crate carries `cfg(target_os = "macos")` branches in
  # open_with.rs, tasks.rs and config.rs. Compiling that target at release time
  # says the branches build; only running the suite here says they work.
  test-platform:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Capped well under the six-hour default: nothing here runs longer than
    # six minutes, so a job still going at fifteen has hung rather than failed.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job uses the token, so it is not left
          # in .git/config for a later step to read.
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2

      # The XCB libraries are how the clipboard reaches X11, so they are a Linux
      # build dependency. macOS reaches its pasteboard through the system
      # framework and has nothing to install.
      - name: Install XCB dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Run tests
        run: cargo test

  # Cargo.toml declares rust-version = "1.97", and `@stable` stops testing it the
  # day 1.98 ships: the claim would go on being made with nothing checking it.
  # Linux only, because the floor is about the toolchain rather than the
  # platform, and test-platform already covers macOS at stable.
  test-floor:
    name: Test (rust 1.97)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job uses the token, so it is not left
          # in .git/config for a later step to read.
          persist-credentials: false

      # The floor is spelled here rather than taken from a file: it moves when
      # rust-version moves, which is rarely and deliberately.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2

      - name: Install XCB dependencies
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Run tests
        run: cargo test

  # A matrix leg reports as `Test (ubuntu-latest)`, a name that changes whenever
  # the matrix does, and a required check that stops reporting blocks every pull
  # request forever. This job reports under one stable name, so branch
  # protection has a single check to require no matter which platforms are
  # added.
  #
  # `always()` and not `!cancelled()`, which looks tidier and is a hole: a
  # cancelled run would skip this job, and GitHub counts a skipped required
  # check as passing, so an unverified commit becomes mergeable. Failing closed
  # costs a red check on runs that were cancelled anyway.
  test:
    name: Test
    needs: [test-platform, test-floor]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check that every platform and version passed
        run: |
          [ "${{ needs.test-platform.result }}" = success ] \
            && [ "${{ needs.test-floor.result }}" = success ]

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job uses the token, so it is not left
          # in .git/config for a later step to read.
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2

      # clippy compiles the crate, so it needs what a build needs.
      - name: Install XCB dependencies
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Check formatting
        run: cargo fmt --check

      # --all-targets, so the tests are linted too. Without it clippy checks the
      # library and the binary only, and `#[cfg(test)]` code is never compiled
      # for it, leaving the largest part of this repository unlinted.
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # Fetches the RustSec advisory database on every run, which a required
      # check normally has no business doing. Kept here because that database
      # is a GitHub-hosted repository, the same host the checkout above already
      # depends on, so requiring it adds no failure mode this job did not have.
      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
